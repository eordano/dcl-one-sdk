[package]
name = "dcl-one-sdk"
version = "0.20.0"
edition = "2021"
description = "Binary-compatible Rust replacement for @dcl/sdk-commands: bundle (rolldown, in-process), preview-serve, and deploy Decentraland SDK7 scenes"
# Same dual terms as abgen, so embedding the converter in-process later is a
# licensing no-op rather than a relicensing event.
license = "Apache-2.0 OR AGPL-3.0-or-later"

[[bin]]
name = "dcl-one-sdk"
path = "src/main.rs"

[dependencies]
sha2 = { workspace = true }
# The watch banner's re-float paces itself to the terminal height; this is
# the cross-platform probe (ioctl on unix, the console API on windows).
terminal_size = "0.4"
oxc_sourcemap = "8"
catalyrst-hashing = { workspace = true }
catalyrst-crypto = { workspace = true }
catalyrst-types = { workspace = true }
catalyrst-preview-tunnel = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true, features = ["ws"] }
tower-http = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
dunce = "1"
flate2 = "1"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
# Already in the lockfile via flate2/zip: the @dcl/ecs component-id hash is a
# plain zlib CRC32 over the component name.
crc32fast = "1"
futures = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }
if-addrs = "=0.15.0"
ignore = "0.4.32"
notify = "8"
prost = "0.14"
qrcode = { version = "=0.14.1", default-features = false, features = ["svg"] }
rand = "0.10"
tokio-tungstenite = { workspace = true }
rolldown = { version = "=1.2.6", optional = true }
rolldown_common = { version = "=1.2.6", optional = true }
rolldown_utils = { version = "=1.2.6", optional = true }
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Local wall-clock for the watcher lines; already in the graph via the
# workspace, so this adds an edge and no package.
chrono = { workspace = true }

[dev-dependencies]
catalyrst-testgate = { workspace = true }
hex = "0.4"
# Same build as the dependency above: the schema-parity test unpacks @dcl/ecs
# out of the vendored node_modules so it needs no scene installed.
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[features]
default = ["rolldown"]
rolldown = ["dep:rolldown", "dep:rolldown_common", "dep:rolldown_utils"]

[build-dependencies]
prost-build = "0.14"
prost = "0.14"
prost-types = "0.14"
# The abgen embed (see abgen-release.lock): sha2 verifies the pinned release
# archive, flate2 compresses it before it goes into the binary.
sha2 = { workspace = true }
flate2 = "1"
