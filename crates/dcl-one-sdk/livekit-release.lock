# The livekit-server that dcl-one-sdk binaries embed, so `start` has voice by
# default with nothing installed.
#
# build.rs reads this file, downloads the release asset for the build target
# into a cache, verifies it against the sha256 below, and embeds the single
# static executable deflated. LIVEKIT_EMBED_BIN=<path> embeds that executable
# instead (brew's on macOS, which LiveKit publishes no release for; a local
# build) and LIVEKIT_EMBED_BIN=none embeds nothing. export-overlay/flake.nix
# does not read this file: a nix build embeds nixpkgs' livekit.
#
# Refresh with: scripts/pin-livekit.sh <tag>   e.g. scripts/pin-livekit.sh v1.13.7
#
# Keys are the release asset suffixes (os_arch.ext), hashes from the release's
# checksums.txt.

version = v1.13.7
url = https://github.com/livekit/livekit/releases/download/{version}/livekit_{semver}_{asset}

linux_amd64.tar.gz   = 6634aeeb2fb1366b6723708ae4320b9d5408106a4c63457c5e845ae3979c90e2
linux_arm64.tar.gz   = 5d167fdf52cf43c0c72972f25325364479f41f854bfef651056eab2504da5de9
linux_armv7.tar.gz   = 48c0150f09fd0ab9baa5fa85af87af99f8f364ecc1256731efb5c62636269fd9
windows_amd64.zip    = e539e7d2f75807b9c9202cd2a0bf2cb3d52fc4c52978a6953e0f47bc339fe77f
